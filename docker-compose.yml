version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: urlshortener-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: urlshortener
    ports:
      - "3306:3306"

  redis:
    image: redis:7.0
    container_name: urlshortener-redis
    ports:
      - "6379:6379"