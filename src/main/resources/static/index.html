<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL 단축 서비스</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 540px;
        }
        h1 { font-size: 24px; margin-bottom: 8px; color: #1a1a1a; }
        p { color: #666; margin-bottom: 24px; font-size: 14px; }
        input[type="url"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="url"]:focus { border-color: #4f46e5; }
        button {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #4338ca; }
        .result {
            margin-top: 24px;
            padding: 16px;
            background: #f0f0ff;
            border-radius: 8px;
            display: none;
        }
        .result p { margin-bottom: 8px; color: #333; }
        .result a {
            color: #4f46e5;
            font-weight: 600;
            word-break: break-all;
        }
        .error {
            margin-top: 16px;
            padding: 12px 16px;
            background: #fff0f0;
            border-radius: 8px;
            color: #c0392b;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>URL 단축 서비스</h1>
    <p>긴 URL을 짧게 줄여드려요</p>
    <input type="url" id="urlInput" placeholder="https://example.com" />
    <button onclick="shorten()">단축하기</button>
    <div class="result" id="result">
        <p>단축된 URL</p>
        <a id="shortUrl" href="#" target="_blank"></a>
    </div>
    <div class="error" id="error"></div>
</div>

<script>
    async function shorten() {
        const input = document.getElementById('urlInput').value.trim();
        const resultBox = document.getElementById('result');
        const errorBox = document.getElementById('error');
        const shortUrlEl = document.getElementById('shortUrl');

        resultBox.style.display = 'none';
        errorBox.style.display = 'none';

        if (!input) {
            errorBox.textContent = 'URL을 입력해주세요.';
            errorBox.style.display = 'block';
            return;
        }

        try {
            const response = await fetch('/api/urls', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ originalUrl: input })
            });

            if (!response.ok) {
                const data = await response.json();
                errorBox.textContent = data.message || '오류가 발생했습니다.';
                errorBox.style.display = 'block';
                return;
            }

            const data = await response.json();
            const short = `${window.location.origin}/${data.shortKey}`;
            shortUrlEl.href = short;
            shortUrlEl.textContent = short;
            resultBox.style.display = 'block';

        } catch (e) {
            errorBox.textContent = '서버와 통신 중 오류가 발생했습니다.';
            errorBox.style.display = 'block';
        }
    }
</script>
</body>
</html>
